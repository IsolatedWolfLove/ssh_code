name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux Deb
            platform: linux
            runs_on: ubuntu-22.04
            package_command: npm run package:deb
            artifact_path: release/*.deb
          - label: macOS DMG
            platform: macos
            runs_on: macos-14
            package_command: npm run package:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
          - label: Windows EXE
            platform: windows
            runs_on: windows-2022
            package_command: npm run package:win
            artifact_path: release/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Install npm dependencies
        shell: bash
        run: npm ci

      - name: Prepare Debian metadata
        if: matrix.platform == 'linux'
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJsonPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          const owner = process.env.REPOSITORY_OWNER;
          const homepage = process.env.REPOSITORY_URL;
          const email = `${owner}@users.noreply.github.com`;

          pkg.homepage ??= homepage;
          pkg.author = typeof pkg.author === 'string'
            ? { name: pkg.author, email }
            : {
                name: pkg.author?.name || owner,
                email: pkg.author?.email || email,
              };
          pkg.build ??= {};
          pkg.build.linux ??= {};
          pkg.build.linux.maintainer ??= `${pkg.author.name} <${pkg.author.email}>`;

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Read app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Build release package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos' && 'false' || '' }}
        run: ${{ matrix.package_command }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-studio-${{ matrix.platform }}-${{ env.APP_VERSION }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          fail_on_unmatched_files: true
